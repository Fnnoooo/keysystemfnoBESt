<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni's Key System</title>
    <style>
        body {
            background-color: #121216;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: #1a1a24;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            text-align: center;
            width: 380px;
            border: 1px solid #2d2d3d;
        }
        h2 { color: #6366f1; margin-top: 0; }
        button {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background-color: #4f46e5; }
        
        /* Fake Ad Overlays */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .popup-box {
            background: #1e1e28;
            padding: 25px;
            border-radius: 10px;
            border: 2px solid #ef4444;
            width: 330px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
        }
        .apple-settings {
            background: #000000;
            color: #f5f5f7;
            border: 1px solid #33333d;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .expired-box {
            border-color: #ef4444;
            background: #1f1414;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h2>Uni's Key System</h2>
        <p id="statusText">Initializing security handshake...</p>
        <div id="actionArea" style="display:none;">
            <p id="actionPrompt">Security check complete. Click below to continue:</p>
            <button onclick="completeTask()">Get My Key</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const adType = urlParams.get('adtype');
        const isExpired = urlParams.get('expired');
        const statusText = document.getElementById('statusText');
        const actionArea = document.getElementById('actionArea');
        const actionPrompt = document.getElementById('actionPrompt');

        // Handle Reset / Expired Key state instantly
        if (isExpired === 'true') {
            document.getElementById('mainContainer').classList.add('expired-box');
            statusText.innerHTML = "<b style='color: #ef4444; font-size: 18px;'>⚠️ KEY EXPIRED & DESTROYED</b><br><br>This session and old key have been completely wiped. The old key no longer works. Please generate a fresh link from Roblox!";
        } else {
            // 10-Second Security Check Timer
            let countdown = 10;
            let timer = setInterval(() => {
                countdown--;
                statusText.innerText = `Security Check: Please wait (${countdown}s)...`;
                if (countdown <= 0) {
                    clearInterval(timer);
                    statusText.innerText = "Security Check Passed Successfully!";
                    actionArea.style.display = "block";
                    
                    // Trigger the requested fake virus ad behavior automatically after countdown
                    triggerFakeAds(adType);
                }
            }, 1000);
        }

        function triggerFakeAds(type) {
            if (!type) return;

            // 5. RARE: Uni's Syste7m4 Hack Popup (Only triggers if explicitly passed as the adtype, or rare chance)
            let rareRoll = Math.floor(Math.random() * 100) + 1; // 1% chance naturally
            if (type === 'unis_syste7m4_rare_hack' || rareRoll === 1) {
                showModal("Congrats you've reached Uni's Syste7m4.", "You are about to get hacked lol so say your prayers.", "#ef4444", "Run Away");
                return;
            }

            // 1. Fake video popup showing something disturbing + VPN warning
            if (type === 'disturbing_video_vpn_overlay') {
                showModal("WARNING virus detected!", "Download this VPN to prevent this virus from hacking you.", "#ef4444", "Download VPN");
            } 
            // 2. Apple settings background warning with custom text & emoji
            else if (type === 'apple_settings_cooked_warning') {
                showAppleModal("WARNING virus detected!", "Your device has been hacked and al your information has been stolen, your cooked lil bro 💀");
            } 
            // 3. Bunch of fake virus warnings popping up every 2 seconds
            else if (type === 'spam_virus_popups_2sec') {
                let count = 0;
                let spam = setInterval(() => {
                    spawnSpamPopup();
                    count++;
                    if (count >= 4) clearInterval(spam);
                }, 2000);
            } 
            // 4. Sends you to download a random VPN off the app store
            else if (type === 'random_vpn_appstore_redirect') {
                setTimeout(() => {
                    window.location.href = "https://apps.apple.com/us/search?term=VPN";
                }, 2500);
            }
        }

        function showModal(title, desc, borderColor, btnText) {
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML = `
                <div class="popup-box" style="border-color: ${borderColor};">
                    <h3 style="color: ${borderColor}; margin-top:0;">${title}</h3>
                    <p style="font-size: 14px; line-height: 1.4;">${desc}</p>
                    <button style="background-color: ${borderColor};" onclick="this.parentElement.parentElement.remove()">${btnText}</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function showAppleModal(title, desc) {
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML = `
                <div class="popup-box apple-settings">
                    <h3 style="color: #ff453a; margin-top:0;">⚙️ Settings</h3>
                    <p style="font-weight: bold; color: #fff;">${title}</p>
                    <p style="font-size: 13px; color: #ccc;">${desc}</p>
                    <button style="background: #0a84ff;" onclick="this.parentElement.parentElement.remove()">Protect Device</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function spawnSpamPopup() {
            const pop = document.createElement('div');
            pop.style.position = 'fixed';
            pop.style.top = (Math.random() * 70 + 10) + '%';
            pop.style.left = (Math.random() * 70 + 10) + '%';
            pop.style.background = '#1e1e28';
            pop.style.border = '2px solid #ef4444';
            pop.style.padding = '15px';
            pop.style.zIndex = '10000';
            pop.style.borderRadius = '8px';
            pop.style.width = '240px';
            pop.style.boxShadow = '0 5px 15px rgba(0,0,0,0.5)';
            pop.innerHTML = `
                <b style="color:#ef4444; font-size:14px;">⚠️ WARNING!</b>
                <p style="margin:8px 0;font-size:12px; color:#fff;">Malicious script execution detected on system!</p>
                <button style="padding:6px; font-size:11px; margin-top:5px; background:#ef4444;" onclick="this.parentElement.remove()">Close</button>
            `;
            document.body.appendChild(pop);
        }

        function completeTask() {
            const hwid = urlParams.get('hwid') || 'UNKNOWN';
            const ts = urlParams.get('ts') || Math.floor(Date.now() / 1000);
            
            // Recompute exact matching key formula
            let str = hwid + ts + "UniSecret123";
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash * 31 + str.charCodeAt(i)) % 1000000007;
            }
            let generatedKey = "FNOFREE_Key" + hash.toString(16).toLowerCase();
            
            document.getElementById('mainContainer').innerHTML = `
                <h2>Key Generated!</h2>
                <p style="font-size: 13px; color: #aaa;">Copy your unique session key below:</p>
                <div style="word-break: break-all; background: #000; padding: 12px; border-radius: 6px; font-family: monospace; color: #4ade80; border: 1px solid #333;">${generatedKey}</div>
                <p style="font-size: 12px; color: #888; margin-top: 15px;">Paste this key back into Roblox to unlock your script.</p>
            `;
        }
    </script>
</body>
</html>
