<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uni's Key System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; 
        }
        .bg-panel { background-color: #161b22; }
        .border-panel { border: 1px solid #30363d; }
        
        .loader { 
            border: 3px solid #30363d; 
            border-top: 3px solid #58a6ff; 
            border-radius: 50%; 
            width: 20px; 
            height: 20px; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Ensures the input box hides overflowing long keys on small phones instead of stretching the screen */
        .truncate-input {
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }
    </style>
</head>
<!-- min-h-[100dvh] fixes the bottom bar clipping issue on mobile Safari/Chrome -->
<body class="min-h-[100dvh] flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-panel border-panel rounded-xl shadow-2xl p-6 sm:p-8 relative mx-auto">
        <h2 class="text-2xl font-bold text-white mb-6 text-center">Uni's Key System</h2>
        
        <!-- Error Overlay -->
        <div id="error-overlay" class="absolute inset-0 bg-panel z-10 rounded-xl hidden flex-col items-center justify-center p-6 text-center">
            <h2 class="text-xl font-bold text-red-500 mb-2">Invalid Session</h2>
            <p class="text-gray-400 text-sm">Please open this link via the Roblox script.</p>
        </div>

        <div class="space-y-4 mb-8">
            <!-- Task 1 -->
            <div id="task1-card" class="border border-panel bg-[#1f242c] rounded-lg p-4 flex flex-row items-center justify-between cursor-pointer active:scale-[0.98] transition-transform">
                <div class="flex items-center space-x-4 min-w-0">
                    <div id="task1-icon" class="flex-shrink-0 w-6 h-6 border-2 border-gray-500 rounded flex items-center justify-center"></div>
                    <div class="min-w-0">
                        <h3 class="text-white font-semibold text-base truncate">Step 1: Wait</h3>
                        <p id="task1-status" class="text-xs text-gray-500 truncate">PENDING</p>
                    </div>
                </div>
            </div>
            
            <!-- Task 2 -->
            <div id="task2-card" class="border border-panel bg-[#1f242c] rounded-lg p-4 flex flex-row items-center justify-between cursor-pointer active:scale-[0.98] transition-transform">
                <div class="flex items-center space-x-4 min-w-0">
                    <div id="task2-icon" class="flex-shrink-0 w-6 h-6 border-2 border-gray-500 rounded flex items-center justify-center"></div>
                    <div class="min-w-0">
                        <h3 class="text-white font-semibold text-base truncate">Step 2: Wait</h3>
                        <p id="task2-status" class="text-xs text-gray-500 truncate">PENDING</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Button -->
        <button id="unlock-btn" disabled class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 rounded-lg opacity-50 cursor-not-allowed transition-all text-base active:scale-[0.98]">
            Unlock Key
        </button>

        <div id="key-container" class="hidden mt-6 bg-[#0d1117] border border-green-500 rounded-lg p-4 text-center">
            <p class="text-xs text-gray-400 mb-2">Your Key:</p>
            <input type="text" id="generated-key" readonly class="w-full bg-transparent text-center text-green-400 font-mono font-bold text-base focus:outline-none cursor-pointer truncate-input">
            <p id="copy-hint" class="text-xs text-gray-500 mt-2">Tap key to copy</p>
        </div>
    </div>

    <div id="task-modal" class="fixed inset-0 bg-black bg-opacity-80 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-panel border-panel rounded-lg p-6 max-w-sm w-full text-center shadow-xl mx-auto">
            <h2 class="text-xl font-bold text-white mb-4">Please Wait...</h2>
            <p class="text-sm text-gray-400 mb-6">Task time: <span id="timer-display" class="font-bold text-purple-500 text-lg">10</span>s</p>
            <button id="close-modal-btn" class="hidden w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-4 rounded text-base active:scale-[0.98] transition-transform">
                Continue
            </button>
        </div>
    </div>

    <script>
        // State variables
        let currentHwid = null;
        let currentActiveTask = null;
        const tasks = {
            1: { time: 10, completed: false },
            2: { time: 10, completed: false }
        };

        // Initialize safely after page loads (prevents obfuscator breaking inline events)
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            currentHwid = params.get('hwid');
            
            if (!currentHwid) {
                document.getElementById('error-overlay').classList.remove('hidden');
            }

            // Bind Event Listeners
            document.getElementById('task1-card').addEventListener('click', () => { handleTaskClick(1); });
            document.getElementById('task2-card').addEventListener('click', () => { handleTaskClick(2); });
            document.getElementById('unlock-btn').addEventListener('click', generateKey);
            document.getElementById('close-modal-btn').addEventListener('click', closeModal);
            
            // Allow tap-to-copy on the generated key
            document.getElementById('generated-key').addEventListener('click', copyKeyToClipboard);
        };

        function handleTaskClick(id) {
            if (tasks[id].completed) return;
            
            currentActiveTask = id;
            document.getElementById('task-modal').classList.remove('hidden');
            
            let timeLeft = tasks[id].time;
            const timerDisplay = document.getElementById('timer-display');
            const closeBtn = document.getElementById('close-modal-btn');
            
            timerDisplay.innerText = timeLeft;
            closeBtn.classList.add('hidden');

            const interval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    closeBtn.classList.remove('hidden');
                    tasks[id].completed = true;
                }
            }, 1000);
        }

        function closeModal() {
            document.getElementById('task-modal').classList.add('hidden');
            
            if (currentActiveTask) {
                const icon = document.getElementById(`task${currentActiveTask}-icon`);
                icon.innerHTML = '✓'; 
                icon.classList.add('border-green-500', 'text-green-500');
                
                document.getElementById(`task${currentActiveTask}-status`).innerText = 'COMPLETED';
            }

            // Check if both are done
            if (tasks[1].completed && tasks[2].completed) {
                const btn = document.getElementById('unlock-btn');
                btn.disabled = false; 
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function generateKey() {
            const date = new Date();
            // Strict UTC Date matching the Lua script's month-1 format (Jan = 0)
            const dateStr = date.getUTCFullYear() + "-" + date.getUTCMonth() + "-" + date.getUTCDate();
            
            let hash = 0;
            const str = currentHwid + dateStr + "UniSecret123";
            
            for (let i = 0; i < str.length; i++) {
                hash = (hash * 31 + str.charCodeAt(i)) % 1000000007;
            }
            
            const finalHex = hash.toString(16).padStart(8, '0');
            const finalKey = `FNOFREE_Key${finalHex}`;

            document.getElementById('key-container').classList.remove('hidden');
            document.getElementById('generated-key').value = finalKey;
            document.getElementById('unlock-btn').style.display = 'none';
        }

        function copyKeyToClipboard() {
            const keyInput = document.getElementById('generated-key');
            keyInput.select();
            keyInput.setSelectionRange(0, 99999); // For mobile devices
            
            try {
                document.execCommand('copy');
                const hint = document.getElementById('copy-hint');
                hint.innerText = "Copied to clipboard!";
                hint.classList.replace('text-gray-500', 'text-green-400');
                
                setTimeout(() => {
                    hint.innerText = "Tap key to copy";
                    hint.classList.replace('text-green-400', 'text-gray-500');
                }, 2000);
            } catch (err) {
                console.error("Failed to copy", err);
            }
        }
    </script>
</body>
</html>
