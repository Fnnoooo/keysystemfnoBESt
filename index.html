<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni's Key System - Secure Gateway</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b0919, #1e1b4b, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            gap: 15px;
        }

        .ad-banner {
            width: 100%;
            background: linear-gradient(90deg, #3f1d1d, #2d1212);
            border: 1px solid #ef4444;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            color: #fca5a5;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
        }

        .container {
            background-color: rgba(18, 18, 26, 0.95);
            backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            text-align: center;
            width: 100%;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        h1 {
            font-size: 20px;
            margin-bottom: 5px;
            color: #fff;
        }

        p {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            text-align: left;
            max-height: 260px;
            overflow-y: auto;
        }

        .task-item {
            background-color: rgba(30, 30, 42, 0.9);
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .task-item.completed {
            border-color: #22c55e;
            color: #22c55e;
        }

        .task-btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .task-btn:hover {
            background-color: #4338ca;
        }

        .task-item.completed .task-btn {
            background-color: #22c55e;
            cursor: default;
        }

        .btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            opacity: 0.4;
            pointer-events: none;
        }

        .btn.enabled {
            opacity: 1;
            pointer-events: auto;
        }

        .btn:hover.enabled {
            background-color: #4338ca;
        }

        .hidden {
            display: none;
        }

        .key-box-container {
            margin-top: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            text-align: center;
            outline: none;
            margin-bottom: 8px;
        }

        .copy-btn {
            background-color: #22c55e;
            opacity: 1;
            pointer-events: auto;
        }

        .copy-btn:hover {
            background-color: #16a34a;
        }

        .hwid-display {
            font-size: 9px;
            color: #475569;
            margin-top: 12px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="ad-banner">
            ⚠️ WARNING: Critical System Driver Update Available! Click to Scan Device!
        </div>

        <div class="container">
            <h1>Uni's Key System</h1>
            <p id="instruction-text">Complete the required checkpoints below to unlock your key.</p>

            <div id="tasks-container" class="task-list"></div>

            <button id="unlock-btn" class="btn" onclick="generateKey()">Generate Key</button>

            <div id="key-container" class="key-box-container hidden">
                <input type="text" id="generated-key" readonly>
                <button class="btn copy-btn" onclick="copyKey()">Click to Copy Key</button>
            </div>

            <div id="hwid-info" class="hwid-display"></div>
        </div>

        <div class="ad-banner">
            🔥 SPONSORED: Play This New 3D MMORPG Without Downloading! Instant Access!
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentHwid = urlParams.get('hwid') || "UNKNOWN";

        if (currentHwid !== "UNKNOWN") {
            document.getElementById('hwid-info').innerText = "Session Target ID: " + currentHwid.substring(0, 16) + "...";
        }

        // Expanded pool of distinct risky/sketchy link shortener & ad redirect domains
        const sketchyUrls = [
            "https://adf.ly",
            "https://shorte.st",
            "https://ouo.io",
            "https://exe.io",
            "https://linkvertise.com",
            "https://boost.ink"
        ];

        // Master pool of distinct tasks
        const masterQuestPool = [
            { type: "ad", title: "Checkpoint: Sponsor Ad Gate 1", actionText: "Visit Ad" },
            { type: "ad", title: "Checkpoint: Sponsor Ad Gate 2", actionText: "Visit Ad" },
            { type: "ad", title: "Checkpoint: Sponsor Ad Gate 3", actionText: "Visit Ad" },
            { type: "timer", title: "Checkpoint: Timed Security Verification (10s)", actionText: "Start Timer", duration: 10 }
        ];

        // Randomly pick a count between 2 and 4 tasks
        const targetTaskCount = Math.floor(Math.random() * 3) + 2; // yields 2, 3, or 4

        // Shuffle and slice to get random unique tasks
        const shuffledPool = [...masterQuestPool].sort(() => Math.random() - 0.5);
        const activeQuests = shuffledPool.slice(0, targetTaskCount);

        // Renumber titles sequentially from 1 to N so they look clean and in order
        activeQuests.forEach((quest, index) => {
            quest.displayTitle = `Task ${index + 1}: ${quest.title.split(': ')[1]}`;
        });

        const completedStatus = new Array(activeQuests.length).fill(false);
        const taskContainer = document.getElementById('tasks-container');

        activeQuests.forEach((quest, index) => {
            const div = document.createElement('div');
            div.className = 'task-item';
            div.id = `quest-${index}`;
            div.innerHTML = `
                <span>${quest.displayTitle}</span>
                <button class="task-btn" id="btn-${index}" onclick="handleQuest(${index})">${quest.actionText}</button>
            `;
            taskContainer.appendChild(div);
        });

        function handleQuest(index) {
            if (completedStatus[index]) return;
            const quest = activeQuests[index];

            if (quest.type === "ad") {
                // Pick a random sketchy destination url from the array
                const randomUrl = sketchyUrls[Math.floor(Math.random() * sketchyUrls.length)];
                window.open(randomUrl, '_blank');
                completeQuest(index);
            } else if (quest.type === "timer") {
                const btn = document.getElementById(`btn-${index}`);
                btn.disabled = true;
                let timeLeft = quest.duration;
                btn.innerText = `${timeLeft}s remaining...`;
                
                const timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        btn.innerText = `${timeLeft}s remaining...`;
                    } else {
                        clearInterval(timerInterval);
                        completeQuest(index);
                    }
                }, 1000);
            }
        }

        function completeQuest(index) {
            completedStatus[index] = true;
            const item = document.getElementById(`quest-${index}`);
            item.classList.add('completed');
            item.querySelector('.task-btn').innerText = "Done ✓";
            
            checkAllDone();
        }

        function checkAllDone() {
            if (completedStatus.every(Boolean)) {
                document.getElementById('unlock-btn').classList.add('enabled');
                document.getElementById('instruction-text').innerText = "All security checkpoints completed successfully!";
            }
        }

        function generateKey() {
            if (currentHwid === "UNKNOWN") {
                alert("Error: Invalid session context token.");
                return;
            }

            // Bind key to exact minute block + random salt so every generation is fully unique
            const timeBlock = Math.floor(Date.now() / 60000);
            const salt = Math.floor(Math.random() * 999999);
            let hash = 0;
            const str = currentHwid + timeBlock + salt + "UniSecret123";
            
            for (let i = 0; i < str.length; i++) {
                hash = (hash * 31 + str.charCodeAt(i)) % 1000000007;
            }
            
            const finalHex = hash.toString(16).padStart(8, '0');
            const finalKey = `FNOFREE_Key${finalHex}`;

            document.getElementById('key-container').classList.remove('hidden');
            document.getElementById('generated-key').value = finalKey;
            document.getElementById('unlock-btn').style.display = 'none';
        }

        function copyKey() {
            const input = document.getElementById('generated-key');
            input.select();
            navigator.clipboard.writeText(input.value);
            
            const btn = document.querySelector('.copy-btn');
            btn.innerText = "Key Copied!";
            setTimeout(() => { btn.innerText = "Click to Copy Key"; }, 2000);
        }
    </script>
</body>
</html>
