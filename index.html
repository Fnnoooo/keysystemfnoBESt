<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni's Key System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        .bg-panel { background-color: #161b22; }
        .border-panel { border: 1px solid #30363d; }
        
        /* Loading Spinner */
        .loader {
            border: 3px solid #30363d;
            border-top: 3px solid #58a6ff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Fake Ad Animations */
        .ad-flash { animation: flash 2s infinite; }
        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        /* Mobile Specific adjustments */
        @media (max-width: 768px) {
            .mobile-ad-container {
                display: flex;
                flex-direction: row;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                gap: 1rem;
                padding-bottom: 1rem;
            }
            .mobile-ad-item {
                flex: 0 0 80%;
                scroll-snap-align: center;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

    <!-- Header -->
    <header class="bg-panel border-b border-panel p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2 text-xl font-bold text-white">
            <svg class="w-6 h-6 text-purple-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a4 4 0 00-4 4v1H5a1 1 0 00-.994.89l-1 9A1 1 0 004 18h12a1 1 0 00.994-1.11l-1-9A1 1 0 0015 7h-1V6a4 4 0 00-4-4zm2 5V6a2 2 0 10-4 0v1h4zm-6 3a1 1 0 112 0 1 1 0 01-2 0zm7-1a1 1 0 100 2 1 1 0 000-2z" clip-rule="evenodd"></path></svg>
            <span>Uni's Key <span class="text-purple-500">System</span></span>
        </div>
        <div class="text-sm text-gray-400" id="hwid-status">Waiting for link...</div>
    </header>

    <!-- Mobile Ad Container (Visible only on small screens) -->
    <div class="md:hidden w-full p-4 pb-0">
        <div class="mobile-ad-container" id="mobile-ad-scroll">
            <!-- Mobile ads will be injected here by JS -->
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col md:flex-row justify-center items-start md:items-stretch p-4 md:p-8 space-y-6 md:space-y-0 md:space-x-8 max-w-6xl mx-auto w-full">

        <!-- Fake Left Ad (Desktop) -->
        <aside id="desktop-ad-left" class="hidden md:flex flex-col w-48 bg-panel border-panel items-center justify-center p-4 rounded-lg ad-flash text-center relative overflow-hidden cursor-pointer shadow-lg transition-transform hover:scale-105">
            <div class="absolute top-1 left-2 text-[10px] text-gray-500 font-bold tracking-widest">SPONSORED</div>
            <!-- Content injected by JS -->
        </aside>

        <!-- Gateway Container -->
        <div class="flex-grow w-full max-w-lg bg-panel border-panel rounded-xl shadow-2xl p-6 md:p-8 relative">
            
            <!-- Error State (If opened without Roblox script) -->
            <div id="error-overlay" class="absolute inset-0 bg-panel z-10 rounded-xl flex flex-col items-center justify-center p-6 text-center">
                <svg class="w-16 h-16 text-red-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <h2 class="text-2xl font-bold text-white mb-2">Invalid Session</h2>
                <p class="text-gray-400 text-sm">You must open this website directly from the Roblox script so your Hardware ID (HWID) is linked to the key.</p>
            </div>

        <!-- Fake Right Ad (Desktop) -->
        <aside id="desktop-ad-right" class="hidden md:flex flex-col w-48 bg-panel border-panel items-center justify-center p-4 rounded-lg text-center relative overflow-hidden cursor-pointer shadow-lg transition-transform hover:scale-105">
            <div class="absolute top-1 left-2 text-[10px] text-gray-500 font-bold tracking-widest">SPONSORED</div>
            <!-- Content injected by JS -->
        </aside>

    </main>

    <!-- Overlay Modal for Tasks -->
    <div id="task-modal" class="fixed inset-0 bg-black bg-opacity-80 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-panel border-panel rounded-lg p-6 md:p-8 max-w-sm w-full text-center shadow-2xl relative">
            <p class="text-[10px] text-gray-500 absolute top-2 right-2">SPONSORED</p>
            <h2 class="text-xl font-bold text-white mb-4">Please Wait...</h2>
            
            <a id="modal-ad-link" href="#" target="_blank" class="block w-full h-32 bg-[#0d1117] mb-4 flex flex-col items-center justify-center border border-gray-700 overflow-hidden relative group cursor-pointer">
                 <img id="modal-ad-img" src="https://placehold.co/300x150/222/555?text=Loading+Sponsor..." class="absolute inset-0 w-full h-full object-cover opacity-50 group-hover:opacity-75 transition-opacity">
                 <span class="text-gray-300 font-bold relative z-10 text-sm bg-black/50 px-2 py-1 rounded">Click to support us!</span>
            </a>

            <p class="text-gray-400 mb-6">Task completes in <span id="timer-display" class="font-bold text-purple-500">10</span> seconds.</p>
            
            <button id="close-modal-btn" class="hidden w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded transition-colors" onclick="closeModal()">
                Continue
            </button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentHwid = null;
        
        const adData = [
            {
                url: "http://www.virus.com", // Example sketchy link
                img: "https://placehold.co/150x150/FF0000/FFFFFF?text=VIRUS+SCAN",
                title: "YOUR DEVICE MAY BE AT RISK!",
                titleColor: "text-red-500",
                desc: "Click here to install our recommended security patch immediately.",
                btnText: "UPDATE NOW",
                btnClass: "bg-green-600 text-white animate-pulse"
            },
            {
                url: "http://www.freerobuxgenerator.com", // Example sketchy link
                img: "https://placehold.co/150x150/000000/FFFF00?text=FREE+ROBUX",
                title: "CLAIM 10,000 ROBUX",
                titleColor: "text-yellow-500",
                desc: "Enter your username to claim your free reward today!",
                btnText: "CLAIM",
                btnClass: "bg-yellow-600 text-black"
            },
            {
                url: "http://www.downloadmoreram.com", // Example sketchy link
                img: "https://placehold.co/150x150/0000FF/FFFFFF?text=RAM+BOOST",
                title: "PC RUNNING SLOW?",
                titleColor: "text-blue-500",
                desc: "Download our free RAM optimizer to speed up your games.",
                btnText: "DOWNLOAD",
                btnClass: "bg-blue-600 text-white"
            },
            {
                url: "http://www.youwon.com", // Example sketchy link
                img: "https://placehold.co/150x150/FF00FF/FFFFFF?text=YOU+WON",
                title: "YOU ARE THE 1,000,000TH VISITOR!",
                titleColor: "text-fuchsia-500",
                desc: "Click here to claim your free iPhone 15 Pro Max.",
                btnText: "CLAIM PRIZE",
                btnClass: "bg-fuchsia-600 text-white animate-bounce"
            }
        ];

        // Helper to shuffle array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function setupAds() {
            const shuffledAds = shuffleArray([...adData]);
            
            // Generate Ad HTML
            const createAdHTML = (ad, isMobile = false) => `
                ${!isMobile ? `<div class="absolute top-1 left-2 text-[10px] text-gray-500 font-bold tracking-widest">SPONSORED</div>` : ''}
                <img src="${ad.img}" alt="Ad" class="mb-4 rounded ${isMobile ? 'h-24 w-auto mx-auto' : ''} border border-gray-700">
                <h3 class="${ad.titleColor} font-black text-lg leading-tight mb-2">${ad.title}</h3>
                <p class="text-xs text-gray-400 mb-4">${ad.desc}</p>
                <button class="${ad.btnClass} font-bold py-2 px-4 rounded w-full mt-auto">${ad.btnText}</button>
            `;

            // Desktop Ads
            const leftAd = document.getElementById('desktop-ad-left');
            const rightAd = document.getElementById('desktop-ad-right');
            
            if (shuffledAds[0]) {
                leftAd.innerHTML = createAdHTML(shuffledAds[0]);
                leftAd.onclick = () => window.open(shuffledAds[0].url, '_blank');
            }
            if (shuffledAds[1]) {
                rightAd.innerHTML = createAdHTML(shuffledAds[1]);
                rightAd.onclick = () => window.open(shuffledAds[1].url, '_blank');
            }

            // Mobile Ads
            const mobileContainer = document.getElementById('mobile-ad-scroll');
            // Determine how many ads to show on mobile (2 to 4)
            const numMobileAds = Math.floor(Math.random() * 3) + 2; 
            
            for(let i=0; i < numMobileAds; i++) {
                // cycle through available ads if we need more than we have unique
                const ad = shuffledAds[i % shuffledAds.length]; 
                const adWrapper = document.createElement('div');
                adWrapper.className = 'mobile-ad-item bg-panel border-panel flex flex-col items-center justify-between p-4 rounded-lg text-center cursor-pointer shadow-lg relative';
                adWrapper.innerHTML = `
                     <div class="absolute top-1 left-2 text-[10px] text-gray-500 font-bold tracking-widest">AD</div>
                    ${createAdHTML(ad, true)}
                `;
                adWrapper.onclick = () => window.open(ad.url, '_blank');
                mobileContainer.appendChild(adWrapper);
            }
        }

        // Initialize Page
        window.onload = function() {
            setupAds();
            const urlParams = new URLSearchParams(window.location.search);
            currentHwid = urlParams.get('hwid');
            const errorOverlay = document.getElementById('error-overlay');
            const hwidStatus = document.getElementById('hwid-status');

            if (currentHwid) {
                // Success: The script provided the HWID
                errorOverlay.style.display = 'none';
                hwidStatus.innerHTML = `<span class="text-green-400">HWID Connected: ${currentHwid.substring(0, 8)}...</span>`;
            } else {
                // Fail: Direct link open without query parameter
                errorOverlay.style.display = 'flex';
                hwidStatus.innerHTML = `<span class="text-red-400">HWID Missing!</span>`;
            }
        };

        const tasks = {
            1: { time: 10, completed: false },
            2: { time: 5, completed: false }
        };
        
        let currentActiveTask = null;
        let timerInterval = null;

        function startTask(taskId) {
            if (tasks[taskId].completed) return; 

            currentActiveTask = taskId;
            const task = tasks[taskId];
            
            // Set random ad for modal
            const randomAd = adData[Math.floor(Math.random() * adData.length)];
            document.getElementById('modal-ad-link').href = randomAd.url;
            document.getElementById('modal-ad-img').src = randomAd.img;

            document.getElementById('task-modal').classList.remove('hidden');
            document.getElementById('close-modal-btn').classList.add('hidden');
            document.getElementById('timer-display').innerText = task.time;
            
            let timeLeft = task.time;
            
            // Set UI to loading state
            document.getElementById(`task${taskId}-icon`).innerHTML = '<div class="loader"></div>';
            document.getElementById(`task${taskId}-icon`).classList.remove('border-2');
            document.getElementById(`task${taskId}-status`).innerText = 'WAITING...';
            document.getElementById(`task${taskId}-status`).classList.replace('text-gray-500', 'text-yellow-500');

            // Countdown timer
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timer-display').innerText = "0";
                    document.getElementById('close-modal-btn').classList.remove('hidden');
                    tasks[taskId].completed = true;
                }
            }, 1000);
        }

        function closeModal() {
            document.getElementById('task-modal').classList.add('hidden');
            
            if (currentActiveTask && tasks[currentActiveTask].completed) {
                const iconDiv = document.getElementById(`task${currentActiveTask}-icon`);
                iconDiv.innerHTML = '<svg class="w-4 h-4 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>';
                iconDiv.classList.add('border-2', 'border-green-500');
                
                const statusDiv = document.getElementById(`task${currentActiveTask}-status`);
                statusDiv.innerText = 'COMPLETED';
                statusDiv.classList.replace('text-yellow-500', 'text-green-500');
            }
            
            currentActiveTask = null;
            checkAllTasksCompleted();
        }

        function checkAllTasksCompleted() {
            if (tasks[1].completed && tasks[2].completed) {
                const btn = document.getElementById('unlock-btn');
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // --- DETERMINISTIC KEY GENERATOR ALGORITHM (UPDATED) ---
        function generateKey() {
            const btn = document.getElementById('unlock-btn');
            btn.style.display = 'none';

            // 1. Get Current UTC Date
            const date = new Date();
            const dateString = date.getUTCFullYear() + "-" + date.getUTCMonth() + "-" + date.getUTCDate();
            
            // 2. Combine HWID and Date into a raw string
            const rawString = currentHwid + dateString + "UniSecret123";
            
            // 3. Mathematical Hash (Converts raw string to a unique number)
            let hash = 0;
            for (let i = 0; i < rawString.length; i++) {
                hash = (hash * 31 + rawString.charCodeAt(i)) % 1000000007; 
            }
            
            // 4. Format into an 8-character Hex String based on the hash
            let hexStr = hash.toString(16);
            let paddedHex = hexStr.padStart(8, '0');
            
            // 5. Finalize formatting (Start with FNOFREE_Key, then append the unique hex)
            const finalKey = `FNOFREE_Key${paddedHex}`;

            // Show key container
            document.getElementById('key-container').classList.remove('hidden');
            document.getElementById('generated-key').value = finalKey;
        }

        function copyKey() {
            const keyInput = document.getElementById('generated-key');
            keyInput.select();
            keyInput.setSelectionRange(0, 99999);
            document.execCommand('copy');
            
            // Visual feedback
            const originalColor = keyInput.style.borderColor;
            keyInput.style.borderColor = '#a855f7'; // Purple flash
            setTimeout(() => {
                keyInput.style.borderColor = originalColor;
            }, 1000);
        }
    </script>
</body>
</html>
