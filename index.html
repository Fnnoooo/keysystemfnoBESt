<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni's Key System</title>
    <style>
        body {
            background-color: #121216;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: #1a1a24;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            text-align: center;
            width: 400px;
            border: 1px solid #2d2d3d;
        }
        h2 { color: #6366f1; margin-top: 0; }
        p { color: #aaa; font-size: 14px; }
        button {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background-color: #4f46e5; }
        
        /* Fake Ad Overlays */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .popup-box {
            background: #1e1e28;
            padding: 25px;
            border-radius: 10px;
            border: 2px solid #ef4444;
            width: 330px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
        }
        .apple-settings {
            background: #000000;
            color: #f5f5f7;
            border: 1px solid #33333d;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .expired-box {
            border-color: #ef4444;
            background: #1f1414;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h2>Uni's Key System</h2>
        <p id="statusText">Complete the tasks below to generate your key.</p>
        
        <div id="taskArea">
            <button onclick="window.open('https://linkvertise.com', '_blank')">Step 1: Complete Linkvertise</button>
            <button style="background-color: #22c55e;" onclick="verifyTasks()">Step 2: Get Key</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const adType = urlParams.get('adtype');
        const isExpired = urlParams.get('expired');
        const mainContainer = document.getElementById('mainContainer');
        const statusText = document.getElementById('statusText');
        const taskArea = document.getElementById('taskArea');

        // Handle Expired / Reset state instantly
        if (isExpired === 'true') {
            mainContainer.classList.add('expired-box');
            statusText.innerHTML = "<b style='color: #ef4444; font-size: 16px;'>⚠️ KEY EXPIRED & DESTROYED</b><br><br>Your previous key has been wiped from the database. Generate a new link through Roblox to get a fresh key.";
            taskArea.innerHTML = `<button style="background-color: #ef4444;" onclick="window.location.href = window.location.pathname">Return to Key System</button>`;
        } else {
            // Trigger background fake ad behavior based on the URL parameter passed from Roblox
            window.addEventListener('load', () => {
                setTimeout(() => triggerFakeAds(adType), 1000);
            });
        }

        function triggerFakeAds(type) {
            if (!type) return;

            // RARE: Uni's Syste7m4 Hack Popup (Only when explicitly triggered)
            if (type === 'unis_syste7m4_rare_hack') {
                showModal("Congrats you've reached Uni's Syste7m4.", "You are about to get hacked lol so say your prayers.", "#ef4444", "Run Away");
                return;
            }

            // 1. Fake video popup with VPN blocker
            if (type === 'disturbing_video_vpn_overlay') {
                showModal("WARNING virus detected!", "Download this VPN to prevent this virus from hacking you.", "#ef4444", "Download VPN");
            } 
            // 2. Apple settings background cooked warning
            else if (type === 'apple_settings_cooked_warning') {
                showAppleModal("WARNING virus detected!", "Your device has been hacked and all your information has been stolen, your cooked lil bro 💀");
            } 
            // 3. Spam virus popups every 2 seconds
            else if (type === 'spam_virus_popups_2sec') {
                let count = 0;
                let spam = setInterval(() => {
                    spawnSpamPopup();
                    count++;
                    if (count >= 4) clearInterval(spam);
                }, 2000);
            } 
            // 4. Random VPN app store redirect
            else if (type === 'random_vpn_appstore_redirect') {
                setTimeout(() => {
                    window.location.href = "https://apps.apple.com/us/search?term=VPN";
                }, 2000);
            }
        }

        function showModal(title, desc, borderColor, btnText) {
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML = `
                <div class="popup-box" style="border-color: ${borderColor};">
                    <h3 style="color: ${borderColor}; margin-top:0;">${title}</h3>
                    <p style="font-size: 14px; line-height: 1.4; color:#ccc;">${desc}</p>
                    <button style="background-color: ${borderColor};" onclick="this.parentElement.parentElement.remove()">${btnText}</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function showAppleModal(title, desc) {
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML = `
                <div class="popup-box apple-settings">
                    <h3 style="color: #ff453a; margin-top:0;">⚙️ Settings</h3>
                    <p style="font-weight: bold; color: #fff;">${title}</p>
                    <p style="font-size: 13px; color: #ccc;">${desc}</p>
                    <button style="background: #0a84ff;" onclick="this.parentElement.parentElement.remove()">Protect Device</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function spawnSpamPopup() {
            const pop = document.createElement('div');
            pop.style.position = 'fixed';
            pop.style.top = (Math.random() * 70 + 10) + '%';
            pop.style.left = (Math.random() * 70 + 10) + '%';
            pop.style.background = '#1e1e28';
            pop.style.border = '2px solid #ef4444';
            pop.style.padding = '15px';
            pop.style.zIndex = '10000';
            pop.style.borderRadius = '8px';
            pop.style.width = '240px';
            pop.style.boxShadow = '0 5px 15px rgba(0,0,0,0.5)';
            pop.innerHTML = `
                <b style="color:#ef4444; font-size:14px;">⚠️ WARNING!</b>
                <p style="margin:8px 0;font-size:12px; color:#fff;">Malicious script execution detected on system!</p>
                <button style="padding:6px; font-size:11px; margin-top:5px; background:#ef4444;" onclick="this.parentElement.remove()">Close</button>
            `;
            document.body.appendChild(pop);
        }

        function verifyTasks() {
            const hwid = urlParams.get('hwid') || 'UNKNOWN';
            const ts = urlParams.get('ts') || Math.floor(Date.now() / 1000);
            
            // Generate the matching key
            let str = hwid + ts + "UniSecret123";
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash * 31 + str.charCodeAt(i)) % 1000000007;
            }
            let generatedKey = "FNOFREE_Key" + hash.toString(16).toLowerCase();
            
            mainContainer.innerHTML = `
                <h2>Your Key is Ready!</h2>
                <p style="font-size: 13px; color: #aaa;">Copy your unique key below:</p>
                <div style="word-break: break-all; background: #000; padding: 12px; border-radius: 6px; font-family: monospace; color: #4ade80; border: 1px solid #333; margin: 15px 0;">${generatedKey}</div>
                <p style="font-size: 12px; color: #888;">Paste this back into Roblox to run the script.</p>
            `;
        }
    </script>
</body>
</html>
