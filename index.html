<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni's Key System - Secure Gateway</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b0919, #1e1b4b, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* New Animated Background Particles */
        .bg-particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            display: block;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
            animation: floatUp 25s linear infinite;
            bottom: -150px;
            border-radius: 8px;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-1200px) rotate(720deg); opacity: 0; }
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            gap: 15px;
            z-index: 1; /* Keep above particles */
        }

        .ad-banner {
            width: 100%;
            background: linear-gradient(90deg, #1e293b, #0f172a);
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 10px;
            text-align: left;
            color: #cbd5e1;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ad-banner:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
            border-color: #6366f1;
        }

        .ad-banner-img {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid #334155;
        }

        .ad-banner-text {
            flex-grow: 1;
        }

        .container {
            background-color: rgba(18, 18, 26, 0.95);
            backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            text-align: center;
            width: 100%;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .header-title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 5px;
        }

        .header-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
            background-color: #0f172a;
        }

        h1 {
            font-size: 20px;
            color: #fff;
            margin: 0;
        }

        p {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            text-align: left;
            max-height: 260px;
            overflow-y: auto;
        }

        .task-item {
            background-color: rgba(30, 30, 42, 0.9);
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .task-item.completed {
            border-color: #22c55e;
            color: #22c55e;
        }

        .task-btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            white-space: nowrap;
            margin-left: 8px;
        }

        .task-btn:hover {
            background-color: #4338ca;
        }

        .task-item.completed .task-btn {
            background-color: #22c55e;
            cursor: default;
        }

        .btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            opacity: 0.4;
            pointer-events: none;
        }

        .btn.enabled {
            opacity: 1;
            pointer-events: auto;
        }

        .btn:hover.enabled {
            background-color: #4338ca;
        }

        .hidden {
            display: none;
        }

        .key-box-container {
            margin-top: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            text-align: center;
            outline: none;
            margin-bottom: 8px;
        }

        .copy-btn {
            background-color: #22c55e;
            opacity: 1;
            pointer-events: auto;
        }

        .copy-btn:hover {
            background-color: #16a34a;
        }

        .hwid-display {
            font-size: 9px;
            color: #475569;
            margin-top: 12px;
            word-break: break-all;
        }

        /* Fake Browser Overlays */
        .fake-website-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 11, 16, 0.9);
            backdrop-filter: blur(5px);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .fake-browser-frame {
            width: 100%;
            max-width: 650px;
            background: #181824;
            border: 1px solid #334155;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            text-align: center;
            animation: popIn 0.3s ease-out;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .fake-browser-header {
            background: #252536;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #33334d;
        }
        .fake-dots {
            display: flex;
            gap: 6px;
        }
        .fake-dot {
            width: 12px; height: 12px; border-radius: 50%;
        }
        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #22c55e; }
        .fake-address-bar {
            background: #111118;
            color: #94a3b8;
            font-size: 11px;
            padding: 5px 15px;
            border-radius: 4px;
            margin-left: 15px;
            flex-grow: 1;
            text-align: left;
            border: 1px solid #33334d;
        }
        .fake-content {
            padding: 30px;
        }
        .popup-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.1);
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .sub-text {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Animated Particles -->
    <div class="bg-particles">
        <div class="particle" style="left: 10%; width: 80px; height: 80px; animation-duration: 18s;"></div>
        <div class="particle" style="left: 30%; width: 40px; height: 40px; animation-duration: 22s; animation-delay: 2s;"></div>
        <div class="particle" style="left: 70%; width: 120px; height: 120px; animation-duration: 25s; animation-delay: 4s;"></div>
        <div class="particle" style="left: 85%; width: 60px; height: 60px; animation-duration: 19s; animation-delay: 0s;"></div>
        <div class="particle" style="left: 50%; width: 30px; height: 30px; animation-duration: 15s; animation-delay: 5s;"></div>
    </div>

    <div class="main-wrapper">
        <!-- Top Banner -->
        <div class="ad-banner" id="topBanner" onclick="openBannerAd(this)">
            <img src="https://placehold.co/100x100/1e293b/ffffff?text=Ad" class="ad-banner-img" id="topBannerImg" alt="Ad">
            <div class="ad-banner-text" id="topBannerText">Loading Advertisement...</div>
        </div>

        <div class="container" id="mainContainer">
            <div class="header-title-area">
                <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=150&auto=format&fit=crop&q=80" alt="Logo" class="header-logo" id="systemLogo">
                <h1>Uni's Key System</h1>
            </div>
            <p id="instruction-text">Complete the required checkpoints below to unlock your key.</p>

            <div id="tasks-container" class="task-list"></div>

            <button id="unlock-btn" class="btn" onclick="generateKey()">Generate Key</button>

            <div id="key-container" class="key-box-container hidden">
                <input type="text" id="generated-key" readonly>
                <button class="btn copy-btn" onclick="copyKey()">Click to Copy Key</button>
            </div>

            <div id="hwid-info" class="hwid-display"></div>
        </div>

        <!-- Bottom Banner -->
        <div class="ad-banner" id="bottomBanner" onclick="openBannerAd(this)">
            <img src="https://placehold.co/100x100/1e293b/ffffff?text=Ad" class="ad-banner-img" id="bottomBannerImg" alt="Ad">
            <div class="ad-banner-text" id="bottomBannerText">Loading Advertisement...</div>
        </div>
    </div>

    <script>
        const logoImg = document.getElementById('systemLogo');
        const fallbackSources = [
            "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=150&auto=format&fit=crop&q=80",
            "https://upload.wikimedia.org/wikipedia/en/3/3b/One_Piece_Logo.svg",
            "https://placehold.co/150x150/1e1b4b/ffffff?text=Nami"
        ];
        let currentSourceIndex = 0;

        logoImg.onerror = function() {
            currentSourceIndex++;
            if (currentSourceIndex < fallbackSources.length) {
                this.src = fallbackSources[currentSourceIndex];
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const currentHwid = urlParams.get('hwid') || "UNKNOWN";
        const sessionTs = urlParams.get('ts') || "0";
        const isExpired = urlParams.get('expired');

        if (isExpired === 'true') {
            document.getElementById('mainContainer').classList.add('expired-box');
            document.getElementById('mainContainer').innerHTML = `
                <div class="header-title-area">
                    <img src="${fallbackSources[0]}" alt="Logo" class="header-logo">
                    <h1 style="color: #ef4444;">⚠️ EXPIRED</h1>
                </div>
                <p style="color: #fca5a5; margin: 15px 0;">This session and old key have been completely wiped. The old key no longer works. Please generate a fresh link from Roblox!</p>
                <button class="btn enabled copy-btn" onclick="window.location.href = window.location.pathname">Return to Key System</button>
            `;
        } else {
            if (currentHwid !== "UNKNOWN") {
                document.getElementById('hwid-info').innerText = "Session Target ID: " + currentHwid.substring(0, 8) + "_" + sessionTs;
            }
        }

        // Expanded Clickable Banners with Images
        const clickableBannerPool = [
            { text: "PLAY NOW: The ultimate 3D MMORPG is here! No downloads required.", url: "https://example.com/mmo", img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=100&auto=format&fit=crop&q=60" },
            { text: "DISCORD: Join 100,000+ players in our community server today!", url: "https://example.com/discord", img: "https://images.unsplash.com/photo-1614680376573-e34360e25fe2?w=100&auto=format&fit=crop&q=60" },
            { text: "GAME DEALS: Get 90% off premium titles this weekend only!", url: "https://example.com/deals", img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=100&auto=format&fit=crop&q=60" },
            { text: "UPGRADE: Need better FPS? Check out the best gaming mice of 2026.", url: "https://example.com/hardware", img: "https://images.unsplash.com/photo-1527814050087-3793815479db?w=100&auto=format&fit=crop&q=60" },
            { text: "GIVEAWAY: Enter to win a $500 digital gift card! Limited entries.", url: "https://example.com/giveaway", img: "https://images.unsplash.com/photo-1607082349566-187342175e2f?w=100&auto=format&fit=crop&q=60" },
            { text: "NEW RELEASE: Explore the vast open world in 'Star Horizon'.", url: "https://example.com/game", img: "https://images.unsplash.com/photo-1614729939124-03290b56c9ce?w=100&auto=format&fit=crop&q=60" }
        ];

        function randomizeBanners() {
            const shuffledBanners = [...clickableBannerPool].sort(() => Math.random() - 0.5);
            
            const topBanner = document.getElementById('topBanner');
            document.getElementById('topBannerText').innerText = shuffledBanners[0].text;
            document.getElementById('topBannerImg').src = shuffledBanners[0].img;
            topBanner.dataset.url = shuffledBanners[0].url;

            const bottomBanner = document.getElementById('bottomBanner');
            document.getElementById('bottomBannerText').innerText = shuffledBanners[1].text;
            document.getElementById('bottomBannerImg').src = shuffledBanners[1].img;
            bottomBanner.dataset.url = shuffledBanners[1].url;
        }

        function openBannerAd(element) {
            if (element.dataset.url) {
                window.open(element.dataset.url, '_blank');
            }
        }

        randomizeBanners();

        const masterQuestPool = [
            { type: "ad", title: "Checkpoint: Discover the Best MMO", actionText: "Play Now" },
            { type: "ad", title: "Checkpoint: Check out this Discord", actionText: "Join" },
            { type: "ad", title: "Checkpoint: Claim Free Virtual Item", actionText: "Claim" },
            { type: "ad", title: "Checkpoint: Support the Creators", actionText: "View Page" },
            { type: "ad", title: "Checkpoint: Watch Game Trailer", actionText: "Watch" },
            { type: "ad", title: "Checkpoint: Best Keyboard Deals", actionText: "Shop" },
            { type: "ad", title: "Checkpoint: Read Developer Blog", actionText: "Read" },
            { type: "timer", title: "Checkpoint: System Check (3s)", actionText: "Verify", duration: 3 },
            { type: "timer", title: "Checkpoint: Link Generation (5s)", actionText: "Start", duration: 5 }
        ];

        const targetTaskCount = Math.floor(Math.random() * 3) + 2; 
        const shuffledPool = [...masterQuestPool].sort(() => Math.random() - 0.5);
        const activeQuests = shuffledPool.slice(0, targetTaskCount);

        activeQuests.forEach((quest, index) => {
            quest.displayTitle = quest.title;
        });

        const completedStatus = new Array(activeQuests.length).fill(false);
        const taskContainer = document.getElementById('tasks-container');

        activeQuests.forEach((quest, index) => {
            const div = document.createElement('div');
            div.className = 'task-item';
            div.id = `quest-${index}`;
            div.innerHTML = `
                <span>${quest.displayTitle}</span>
                <button class="task-btn" id="btn-${index}" onclick="handleQuest(${index})">${quest.actionText}</button>
            `;
            taskContainer.appendChild(div);
        });

        function handleQuest(index) {
            if (completedStatus[index]) return;
            const quest = activeQuests[index];

            if (quest.type === "ad") {
                openFakeWebsite(() => {
                    completeQuest(index);
                });
            } else if (quest.type === "timer") {
                const btn = document.getElementById(`btn-${index}`);
                btn.disabled = true;
                let timeLeft = quest.duration;
                btn.innerText = `${timeLeft}s...`;
                
                const timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        btn.innerText = `${timeLeft}s...`;
                    } else {
                        clearInterval(timerInterval);
                        completeQuest(index);
                    }
                }, 1000);
            }
        }

        // Expanded Pool of Fake Sites
        const fakeWebsites = [
            {
                url: "https://discord-community-hub.com/invite",
                title: "Join our Community!",
                buttonText: "Accept Invite",
                img: "https://images.unsplash.com/photo-1614680376573-e34360e25fe2?w=300&auto=format&fit=crop&q=60",
                content: `
                    <h2 style="color: #6366f1; margin-bottom: 8px;">YOU'RE INVITED!</h2>
                    <p style="color: #ccc; font-size: 13px; margin-bottom: 15px;">Join 50,000 other gamers in the best Discord server. Get exclusive scripts and codes!</p>
                `
            },
            {
                url: "https://daily-rewards-center.net/claim",
                title: "🎁 Daily Reward Ready",
                buttonText: "Claim to Inventory",
                img: "https://images.unsplash.com/photo-1607082349566-187342175e2f?w=300&auto=format&fit=crop&q=60",
                content: `
                    <h2 style="color: #22c55e; margin-bottom: 8px;">DAILY LOGIN BONUS</h2>
                    <p style="color: #ccc; font-size: 13px; margin-bottom: 15px;">You have a pending reward chest waiting to be opened. Claim it before it expires!</p>
                `
            },
            {
                url: "https://premium-upgrade-store.com/checkout",
                title: "Upgrade to VIP Tier",
                buttonText: "View Benefits",
                img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=300&auto=format&fit=crop&q=60",
                content: `
                    <h2 style="color: #f59e0b; margin-bottom: 8px;">TIRED OF WAITING?</h2>
                    <p style="color: #ccc; font-size: 13px; margin-bottom: 15px;">Bypass this entire key system forever by purchasing a lifetime VIP subscription.</p>
                `
            },
            {
                url: "https://virtual-pet-care.net/feed",
                title: "🐾 Your Pet Needs You!",
                buttonText: "Feed Pet",
                img: "https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=300&auto=format&fit=crop&q=60",
                content: `
                    <h2 style="color: #ec4899; margin-bottom: 8px;">HUNGRY PET ALERT</h2>
                    <p style="color: #ccc; font-size: 13px; margin-bottom: 15px;">Your virtual companion's hunger bar is critically low. Please feed them immediately.</p>
                `
            },
            {
                url: "https://rpg-browser-game.org/play",
                title: "Defeat the Dragon",
                buttonText: "Start Quest",
                img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=300&auto=format&fit=crop&q=60",
                content: `
                    <h2 style="color: #ef4444; margin-bottom: 8px;">EPIC BOSS FIGHT</h2>
                    <p style="color: #ccc; font-size: 13px; margin-bottom: 15px;">The realm is under attack. Gear up and join the raid to defeat the Obsidian Dragon!</p>
                `
            },
            {
                url: "https://esports-tournament-live.tv/stream",
                title: "LIVE: Grand Finals",
                buttonText: "Watch Stream",
                img: "https://images.unsplash.com/photo-1540224871915-bc8ffb782bdf?w=300&auto=format&fit=crop&q=60",
                content: `
                    <h2 style="color: #8b5cf6; margin-bottom: 8px;">TOURNAMENT LIVE NOW</h2>
                    <p style="color: #ccc; font-size: 13px; margin-bottom: 15px;">Watch the top players compete for a $1,000,000 prize pool. Don't miss the action!</p>
                `
            },
            {
                url: "https://rate-our-app-portal.net/feedback",
                title: "⭐ Rate Your Experience",
                buttonText: "Submit 5 Stars",
                img: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=300&auto=format&fit=crop&q=60",
                content: `
                    <h2 style="color: #eab308; margin-bottom: 8px;">WE VALUE YOUR FEEDBACK</h2>
                    <p style="color: #ccc; font-size: 13px; margin-bottom: 15px;">Enjoying the scripts? Please leave us a 5-star review on the official catalog page!</p>
                `
            },
            {
                url: "https://exclusive-beta-access.com/register",
                title: "Closed Beta Registration",
                buttonText: "Sign Up Now",
                img: "https://images.unsplash.com/photo-1614729939124-03290b56c9ce?w=300&auto=format&fit=crop&q=60",
                content: `
                    <h2 style="color: #14b8a6; margin-bottom: 8px;">EARLY ACCESS GRANTED</h2>
                    <p style="color: #ccc; font-size: 13px; margin-bottom: 15px;">You have been selected to test our new unreleased software. Spots are extremely limited.</p>
                `
            }
        ];

        let currentCloseCallback = null;

        function openFakeWebsite(callback) {
            currentCloseCallback = callback;
            const site = fakeWebsites[Math.floor(Math.random() * fakeWebsites.length)];

            // Generate Random Timer between 5 and 10 seconds
            let countdown = Math.floor(Math.random() * 6) + 5;

            const overlay = document.createElement('div');
            overlay.id = 'fakeWebOverlay';
            overlay.className = 'fake-website-overlay';
            overlay.innerHTML = `
                <div class="fake-browser-frame">
                    <div class="fake-browser-header">
                        <div class="fake-dots">
                            <div class="fake-dot dot-red"></div>
                            <div class="fake-dot dot-yellow"></div>
                            <div class="fake-dot dot-green"></div>
                        </div>
                        <div class="fake-address-bar">🔒 ${site.url}</div>
                    </div>
                    <div class="fake-content">
                        <img src="${site.img}" class="popup-img" alt="${site.title}">
                        ${site.content}
                        <button id="closePopupBtn" style="background: #334155; color:white; border:none; padding:12px 30px; border-radius:6px; font-weight:bold; cursor:not-allowed;" disabled>Please Wait (${countdown}s)...</button>
                        <div class="sub-text">Advertisement</div>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            const btn = document.getElementById('closePopupBtn');
            const timerInterval = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    btn.innerHTML = `Please Wait (${countdown}s)...`;
                } else {
                    clearInterval(timerInterval);
                    btn.disabled = false;
                    btn.style.cursor = 'pointer';
                    btn.style.backgroundColor = '#6366f1';
                    btn.innerHTML = site.buttonText;
                    btn.onclick = closeFakeWebsite;
                }
            }, 1000);
        }

        function closeFakeWebsite() {
            const overlay = document.getElementById('fakeWebOverlay');
            if (overlay) overlay.remove();
            if (currentCloseCallback) {
                currentCloseCallback();
                currentCloseCallback = null;
            }
        }

        function completeQuest(index) {
            completedStatus[index] = true;
            const item = document.getElementById(`quest-${index}`);
            item.classList.add('completed');
            item.querySelector('.task-btn').innerText = "Done ✓";
            
            checkAllDone();
        }

        function checkAllDone() {
            if (completedStatus.every(Boolean)) {
                document.getElementById('unlock-btn').classList.add('enabled');
                document.getElementById('instruction-text').innerText = "All checkpoints completed successfully!";
            }
        }

        function generateKey() {
            if (currentHwid === "UNKNOWN") {
                alert("Error: Invalid session context token.");
                return;
            }

            let hash = 0;
            const str = currentHwid + sessionTs + "UniSecret123";
            
            for (let i = 0; i < str.length; i++) {
                hash = (hash * 31 + str.charCodeAt(i)) % 1000000007;
            }
            
            const finalHex = hash.toString(16).padStart(8, '0');
            const finalKey = `FNOFREE_Key${finalHex}`;

            document.getElementById('key-container').classList.remove('hidden');
            document.getElementById('generated-key').value = finalKey;
            document.getElementById('unlock-btn').style.display = 'none';
        }

        function copyKey() {
            const input = document.getElementById('generated-key');
            input.select();
            navigator.clipboard.writeText(input.value);
            
            const btn = document.querySelector('.copy-btn');
            btn.innerText = "Key Copied!";
            setTimeout(() => { btn.innerText = "Click to Copy Key"; }, 2000);
        }
    </script>
</body>
</html>
