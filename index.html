<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni's Key System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121216;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background-color: #1a1a22;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 420px;
            border: 1px solid #2a2a35;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #fff;
        }

        p {
            color: #a0a0ab;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .btn {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-bottom: 15px;
        }

        .btn:hover {
            background-color: #4752C4;
        }

        .hidden {
            display: none;
        }

        .key-box-container {
            margin-top: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #252530;
            border: 1px solid #3a3a48;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            text-align: center;
            outline: none;
            margin-bottom: 10px;
        }

        .copy-btn {
            background-color: #3ba55d;
        }

        .copy-btn:hover {
            background-color: #2d8046;
        }

        .hwid-display {
            font-size: 11px;
            color: #666;
            margin-top: 20px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Uni's Key System</h1>
        <p>Click below to generate your daily access key.</p>

        <!-- Unlock Button (Triggers Key Generation) -->
        <button id="unlock-btn" class="btn" onclick="generateKey()">Generate Key</button>

        <!-- Key Output Container (Hidden initially) -->
        <div id="key-container" class="key-box-container hidden">
            <input type="text" id="generated-key" readonly>
            <button class="btn copy-btn" onclick="copyKey()">Copy Key</button>
        </div>

        <div id="hwid-info" class="hwid-display"></div>
    </div>

    <script>
        // Grab HWID from URL parameters provided by the Roblox exploit script
        const urlParams = new URLSearchParams(window.location.search);
        const currentHwid = urlParams.get('hwid') || "UNKNOWN";

        // Display HWID for debugging if needed
        if (currentHwid !== "UNKNOWN") {
            document.getElementById('hwid-info').innerText = "Connected HWID: " + currentHwid;
        }

        function generateKey() {
            if (currentHwid === "UNKNOWN") {
                alert("Error: No HWID detected! Please open the link directly through your Roblox script.");
                return;
            }

            // Matches the daily string logic in the Lua script (Valid all day)
            const date = new Date();
            const dateStr = date.getUTCFullYear() + "-" + date.getUTCMonth() + "-" + date.getUTCDate();
            
            let hash = 0;
            const str = currentHwid + dateStr + "UniSecret123";
            
            for (let i = 0; i < str.length; i++) {
                hash = (hash * 31 + str.charCodeAt(i)) % 1000000007;
            }
            
            const finalHex = hash.toString(16).padStart(8, '0');
            const finalKey = `FNOFREE_Key${finalHex}`;

            // Show the result
            document.getElementById('key-container').classList.remove('hidden');
            document.getElementById('generated-key').value = finalKey;
            document.getElementById('unlock-btn').style.display = 'none';
        }

        function copyKey() {
            const keyInput = document.getElementById('generated-key');
            keyInput.select();
            keyInput.setSelectionRange(0, 99999); // For mobile devices
            navigator.clipboard.writeText(keyInput.value);
            
            const copyBtn = document.querySelector('.copy-btn');
            copyBtn.innerText = "Copied!";
            setTimeout(() => {
                copyBtn.innerText = "Copy Key";
            }, 2000);
        }
    </script>
</body>
</html>
