<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni's Key System</title>
    <style>
        body {
            background-color: #191920;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: #111116;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 350px;
        }
        h2 { color: #4f46e5; }
        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
        }
        button:hover { background-color: #4338ca; }
        
        /* Fake Ad Overlays */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .popup-box {
            background: #252532;
            padding: 25px;
            border-radius: 8px;
            border: 2px solid #dc2626;
            width: 320px;
            text-align: center;
        }
        .apple-bg {
            background: #000000;
            color: #f5f5f7;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h2>Uni's Key System</h2>
        <p id="statusText">Checking security parameters...</p>
        <div id="actionArea" style="display:none;">
            <p>Click below to complete security check:</p>
            <button onclick="completeTask()">Continue to Key</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const adType = urlParams.get('adtype');
        const isExpired = urlParams.get('expired');
        const statusText = document.getElementById('statusText');
        const actionArea = document.getElementById('actionArea');

        // Handle expired states if reset was triggered
        if (isExpired === 'true') {
            statusText.innerHTML = "<span style='color: #dc2626;'>KEY EXPIRED! This key and session have been destroyed by the user. Generate a new one from Roblox.</span>";
        } else {
            // 10-Second Security Timer simulation
            let countdown = 10;
            let timer = setInterval(() => {
                countdown--;
                statusText.innerText = `Security Check: Please wait ${countdown} seconds...`;
                if (countdown <= 0) {
                    clearInterval(timer);
                    statusText.innerText = "Security Check Passed!";
                    actionArea.style.display = "block";
                    triggerFakeAds(adType);
                }
            }, 1000);
        }

        function triggerFakeAds(type) {
            if (!type) return;

            // 5. RARE: Uni's Syste7m4 Hack Popup
            if (type === 'unis_syste7m4_rare_hack' || Math.floor(Math.random() * 100) === 1) {
                showModal("Congrats you've reached Uni's Syste7m4.", "You are about to get hacked lol so say your prayers.", "#dc2626");
                return;
            }

            // 1. Fake video popup with VPN blocker
            if (type === 'disturbing_video_vpn_overlay') {
                showModal("WARNING virus detected!", "Download this VPN to prevent this virus from hacking you.", "#dc2626");
            } 
            // 2. Apple settings background cooked warning
            else if (type === 'apple_settings_cooked_warning') {
                showAppleModal("WARNING virus detected!", "Your device has been hacked and all your information has been stolen, your cooked lil bro 💀");
            } 
            // 3. Spam virus popups every 2 seconds
            else if (type === 'spam_virus_popups_2sec') {
                let spamCount = 0;
                let spamInterval = setInterval(() => {
                    spawnSpamPopup();
                    spamCount++;
                    if (spamCount > 5) clearInterval(spamInterval);
                }, 2000);
            } 
            // 4. Random VPN app store redirect trigger
            else if (type === 'random_vpn_appstore_redirect') {
                setTimeout(() => {
                    window.location.href = "https://apps.apple.com/us/search?term=VPN";
                }, 3000);
            }
        }

        function showModal(title, desc, borderColor) {
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML = `
                <div class="popup-box" style="border-color: ${borderColor};">
                    <h3 style="color: ${borderColor};">${title}</h3>
                    <p>${desc}</p>
                    <button onclick="this.parentElement.parentElement.remove()">Download VPN</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function showAppleModal(title, desc) {
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML = `
                <div class="popup-box apple-bg">
                    <h3 style="color: #ff453a;">⚙️ Settings - ${title}</h3>
                    <p>${desc}</p>
                    <button style="background: #0a84ff;" onclick="this.parentElement.parentElement.remove()">Protect Device</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function spawnSpamPopup() {
            const pop = document.createElement('div');
            pop.style.position = 'fixed';
            pop.style.top = Math.random() * 80 + '%';
            pop.style.left = Math.random() * 80 + '%';
            pop.style.background = '#252532';
            pop.style.border = '2px solid red';
            pop.style.padding = '15px';
            pop.style.zIndex = '10000';
            pop.style.borderRadius = '5px';
            pop.innerHTML = `<b style="color:red;">WARNING!</b><p style="margin:5px 0;font-size:12px;">Virus injected into system!</p><button style="padding:5px;font-size:10px;" onclick="this.parentElement.remove()">Close</button>`;
            document.body.appendChild(pop);
        }

        function completeTask() {
            const hwid = urlParams.get('hwid') || 'UNKNOWN';
            const ts = urlParams.get('ts') || Math.floor(Date.now() / 1000);
            
            // Simple client-side key generation formula matching your script
            let str = hwid + ts + "UniSecret123";
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash * 31 + str.charCodeAt(i)) % 1000000007;
            }
            let generatedKey = "FNOFREE_Key" + hash.toString(16).toLowerCase();
            
            document.body.innerHTML = `
                <div class="container">
                    <h2>Your Key is Ready!</h2>
                    <p style="word-break: break-all; background: #000; padding: 10px; border-radius: 5px;">${generatedKey}</p>
                    <p style="font-size: 12px; color: #888;">Copy this key and paste it back into Roblox.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
