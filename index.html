<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni's Key System - Secure Gateway</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b0919, #1e1b4b, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            gap: 15px;
        }

        .ad-banner {
            width: 100%;
            background: linear-gradient(90deg, #3f1d1d, #2d1212);
            border: 1px solid #ef4444;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            color: #fca5a5;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
        }

        .container {
            background-color: rgba(18, 18, 26, 0.95);
            backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            text-align: center;
            width: 100%;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .container.expired-box {
            border-color: #ef4444;
            background-color: rgba(31, 20, 20, 0.95);
        }

        h1 {
            font-size: 20px;
            margin-bottom: 5px;
            color: #fff;
        }

        p {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            text-align: left;
            max-height: 260px;
            overflow-y: auto;
        }

        .task-item {
            background-color: rgba(30, 30, 42, 0.9);
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .task-item.completed {
            border-color: #22c55e;
            color: #22c55e;
        }

        .task-btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .task-btn:hover {
            background-color: #4338ca;
        }

        .task-item.completed .task-btn {
            background-color: #22c55e;
            cursor: default;
        }

        .btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            opacity: 0.4;
            pointer-events: none;
        }

        .btn.enabled {
            opacity: 1;
            pointer-events: auto;
        }

        .btn:hover.enabled {
            background-color: #4338ca;
        }

        .hidden {
            display: none;
        }

        .key-box-container {
            margin-top: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            text-align: center;
            outline: none;
            margin-bottom: 8px;
        }

        .copy-btn {
            background-color: #22c55e;
            opacity: 1;
            pointer-events: auto;
        }

        .copy-btn:hover {
            background-color: #16a34a;
        }

        .hwid-display {
            font-size: 9px;
            color: #475569;
            margin-top: 12px;
            word-break: break-all;
        }

        /* Fake Ad Overlays */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .popup-box {
            background: #1e1e28;
            padding: 25px;
            border-radius: 10px;
            border: 2px solid #ef4444;
            width: 330px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
        }
        .apple-settings {
            background: #000000;
            color: #f5f5f7;
            border: 1px solid #33333d;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="ad-banner">
            ⚠️ WARNING: Critical System Driver Update Available! Click to Scan Device!
        </div>

        <div class="container" id="mainContainer">
            <h1>Uni's Key System</h1>
            <p id="instruction-text">Complete the required checkpoints below to unlock your key.</p>

            <div id="tasks-container" class="task-list"></div>

            <button id="unlock-btn" class="btn" onclick="generateKey()">Generate Key</button>

            <div id="key-container" class="key-box-container hidden">
                <input type="text" id="generated-key" readonly>
                <button class="btn copy-btn" onclick="copyKey()">Click to Copy Key</button>
            </div>

            <div id="hwid-info" class="hwid-display"></div>
        </div>

        <div class="ad-banner">
            🔥 SPONSORED: Play This New 3D MMORPG Without Downloading! Instant Access!
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentHwid = urlParams.get('hwid') || "UNKNOWN";
        const sessionTs = urlParams.get('ts') || "0";
        const adType = urlParams.get('adtype');
        const isExpired = urlParams.get('expired');

        // Handle Expired / Reset state instantly
        if (isExpired === 'true') {
            document.getElementById('mainContainer').classList.add('expired-box');
            document.getElementById('mainContainer').innerHTML = `
                <h1 style="color: #ef4444;">⚠️ KEY EXPIRED & DESTROYED</h1>
                <p style="color: #fca5a5; margin: 15px 0;">This session and old key have been completely wiped. The old key no longer works. Please generate a fresh link from Roblox!</p>
                <button class="btn enabled copy-btn" onclick="window.location.href = window.location.pathname">Return to Key System</button>
            `;
        } else {
            if (currentHwid !== "UNKNOWN") {
                document.getElementById('hwid-info').innerText = "Session Target ID: " + currentHwid.substring(0, 8) + "_" + sessionTs;
            }

            // Trigger dynamic fake virus ads automatically on load based on Roblox parameters
            window.addEventListener('load', () => {
                if (adType) {
                    setTimeout(() => triggerFakeAds(adType), 1000);
                }
            });
        }

        const sketchyUrls = [
            "https://adf.ly",
            "https://shorte.st",
            "https://ouo.io",
            "https://exe.io",
            "https://linkvertise.com",
            "https://boost.ink"
        ];

        const masterQuestPool = [
            { type: "ad", title: "Checkpoint: Sponsor Ad Gate 1", actionText: "Visit Ad" },
            { type: "ad", title: "Checkpoint: Sponsor Ad Gate 2", actionText: "Visit Ad" },
            { type: "ad", title: "Checkpoint: Sponsor Ad Gate 3", actionText: "Visit Ad" },
            { type: "timer", title: "Checkpoint: Timed Security Verification (10s)", actionText: "Start Timer", duration: 10 }
        ];

        const targetTaskCount = Math.floor(Math.random() * 3) + 2;
        const shuffledPool = [...masterQuestPool].sort(() => Math.random() - 0.5);
        const activeQuests = shuffledPool.slice(0, targetTaskCount);

        activeQuests.forEach((quest, index) => {
            quest.displayTitle = `Task ${index + 1}: ${quest.title.split(': ')[1]}`;
        });

        const completedStatus = new Array(activeQuests.length).fill(false);
        const taskContainer = document.getElementById('tasks-container');

        activeQuests.forEach((quest, index) => {
            const div = document.createElement('div');
            div.className = 'task-item';
            div.id = `quest-${index}`;
            div.innerHTML = `
                <span>${quest.displayTitle}</span>
                <button class="task-btn" id="btn-${index}" onclick="handleQuest(${index})">${quest.actionText}</button>
            `;
            taskContainer.appendChild(div);
        });

        function handleQuest(index) {
            if (completedStatus[index]) return;
            const quest = activeQuests[index];

            if (quest.type === "ad") {
                const randomUrl = sketchyUrls[Math.floor(Math.random() * sketchyUrls.length)];
                window.open(randomUrl, '_blank');
                completeQuest(index);
            } else if (quest.type === "timer") {
                const btn = document.getElementById(`btn-${index}`);
                btn.disabled = true;
                let timeLeft = quest.duration;
                btn.innerText = `${timeLeft}s remaining...`;
                
                const timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        btn.innerText = `${timeLeft}s remaining...`;
                    } else {
                        clearInterval(timerInterval);
                        completeQuest(index);
                    }
                }, 1000);
            }
        }

        function completeQuest(index) {
            completedStatus[index] = true;
            const item = document.getElementById(`quest-${index}`);
            item.classList.add('completed');
            item.querySelector('.task-btn').innerText = "Done ✓";
            
            checkAllDone();
        }

        function checkAllDone() {
            if (completedStatus.every(Boolean)) {
                document.getElementById('unlock-btn').classList.add('enabled');
                document.getElementById('instruction-text').innerText = "All security checkpoints completed successfully!";
            }
        }

        function triggerFakeAds(type) {
            // RARE: Uni's Syste7m4 Hack Popup
            let rareRoll = Math.floor(Math.random() * 100) + 1;
            if (type === 'unis_syste7m4_rare_hack' || rareRoll === 1) {
                showModal("Congrats you've reached Uni's Syste7m4.", "You are about to get hacked lol so say your prayers.", "#ef4444", "Run Away");
                return;
            }

            if (type === 'disturbing_video_vpn_overlay') {
                showModal("WARNING virus detected!", "Download this VPN to prevent this virus from hacking you.", "#ef4444", "Download VPN");
            } 
            else if (type === 'apple_settings_cooked_warning') {
                showAppleModal("WARNING virus detected!", "Your device has been hacked and all your information has been stolen, your cooked lil bro 💀");
            } 
            else if (type === 'spam_virus_popups_2sec') {
                let count = 0;
                let spam = setInterval(() => {
                    spawnSpamPopup();
                    count++;
                    if (count >= 4) clearInterval(spam);
                }, 2000);
            } 
            else if (type === 'random_vpn_appstore_redirect') {
                setTimeout(() => {
                    window.location.href = "https://apps.apple.com/us/search?term=VPN";
                }, 2000);
            }
        }

        function showModal(title, desc, borderColor, btnText) {
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML = `
                <div class="popup-box" style="border-color: ${borderColor};">
                    <h3 style="color: ${borderColor}; margin-top:0;">${title}</h3>
                    <p style="font-size: 14px; line-height: 1.4; color: #ccc;">${desc}</p>
                    <button style="background-color: ${borderColor}; color:white; border:none; padding:10px 15px; border-radius:6px; cursor:pointer; margin-top:15px; font-weight:bold;" onclick="this.parentElement.parentElement.remove()">${btnText}</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function showAppleModal(title, desc) {
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML = `
                <div class="popup-box apple-settings" style="border:1px solid #333;">
                    <h3 style="color: #ff453a; margin-top:0;">⚙️ Settings</h3>
                    <p style="font-weight: bold; color: #fff; margin:5px 0;">${title}</p>
                    <p style="font-size: 13px; color: #ccc;">${desc}</p>
                    <button style="background: #0a84ff; color:white; border:none; padding:10px 15px; border-radius:6px; cursor:pointer; margin-top:15px; font-weight:bold;" onclick="this.parentElement.parentElement.remove()">Protect Device</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function spawnSpamPopup() {
            const pop = document.createElement('div');
            pop.style.position = 'fixed';
            pop.style.top = (Math.random() * 70 + 10) + '%';
            pop.style.left = (Math.random() * 70 + 10) + '%';
            pop.style.background = '#1e1e28';
            pop.style.border = '2px solid #ef4444';
            pop.style.padding = '15px';
            pop.style.zIndex = '10000';
            pop.style.borderRadius = '8px';
            pop.style.width = '240px';
            pop.style.boxShadow = '0 5px 15px rgba(0,0,0,0.5)';
            pop.innerHTML = `
                <b style="color:#ef4444; font-size:14px;">⚠️ WARNING!</b>
                <p style="margin:8px 0;font-size:12px; color:#fff;">Malicious script execution detected on system!</p>
                <button style="padding:6px; font-size:11px; margin-top:5px; background:#ef4444; color:white; border:none; border-radius:4px; cursor:pointer;" onclick="this.parentElement.remove()">Close</button>
            `;
            document.body.appendChild(pop);
        }

        function generateKey() {
            if (currentHwid === "UNKNOWN") {
                alert("Error: Invalid session context token.");
                return;
            }

            let hash = 0;
            const str = currentHwid + sessionTs + "UniSecret123";
            
            for (let i = 0; i < str.length; i++) {
                hash = (hash * 31 + str.charCodeAt(i)) % 1000000007;
            }
            
            const finalHex = hash.toString(16).padStart(8, '0');
            const finalKey = `FNOFREE_Key${finalHex}`;

            document.getElementById('key-container').classList.remove('hidden');
            document.getElementById('generated-key').value = finalKey;
            document.getElementById('unlock-btn').style.display = 'none';
        }

        function copyKey() {
            const input = document.getElementById('generated-key');
            input.select();
            navigator.clipboard.writeText(input.value);
            
            const btn = document.querySelector('.copy-btn');
            btn.innerText = "Key Copied!";
            setTimeout(() => { btn.innerText = "Click to Copy Key"; }, 2000);
        }
    </script>
</body>
</html>
